name: update cask version

# checkov:skip=CKV_GHA_7:workflow_dispatch input is required to specify the version to update
on:
  workflow_dispatch:
    inputs:
      version:
        description: "New SDK version (e.g. 4.3.0.26057)"
        required: true
        type: string

permissions: {}

jobs:
  update-cask:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify package exists on S3
        env:
          VERSION: ${{ inputs.version }}
        run: |
          PKG_URL="https://senzing-production-osx.s3.amazonaws.com/senzingsdk_${VERSION}.dmg"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --head "$PKG_URL")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Package not found at $PKG_URL (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "PKG_URL=$PKG_URL" >> "$GITHUB_ENV"

      - name: Download and calculate SHA256
        run: |
          curl -sL "$PKG_URL" -o senzingsdk.dmg
          SHA=$(shasum -a 256 senzingsdk.dmg | awk '{print $1}')
          echo "SHA256=$SHA" >> "$GITHUB_ENV"
          echo "Calculated SHA256: $SHA"
          rm senzingsdk.dmg

      - name: Update cask file
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i "s/version \"[0-9][0-9.]*\"/version \"${VERSION}\"/" Casks/senzingsdk.rb
          sed -i "s/sha256 \"[0-9a-f]\{64\}\"/sha256 \"${SHA256}\"/" Casks/senzingsdk.rb

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          BRANCH="cask-update-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git checkout -b "$BRANCH"
          git add Casks/senzingsdk.rb
          git commit -m "Update senzingsdk cask to ${VERSION}"
          git push origin "$BRANCH"
          gh pr create \
            --title "Update senzingsdk cask to ${VERSION}" \
            --body "$(cat <<EOF
          Automated update of senzingsdk cask.

          - **Version:** \`${VERSION}\`
          - **SHA256:** \`${SHA256}\`
          - **Package URL:** \`${PKG_URL}\`
          EOF
          )"
