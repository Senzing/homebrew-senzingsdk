name: update cask version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New SDK version (e.g. 4.3.0.26057)"
        required: true
        type: string

permissions: {}

jobs:
  update-cask:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify package exists on S3
        run: |
          PKG_URL="https://senzing-staging-osx.s3.amazonaws.com/senzingsdk_${{ inputs.version }}.pkg"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --head "$PKG_URL")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Package not found at $PKG_URL (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "PKG_URL=$PKG_URL" >> "$GITHUB_ENV"

      - name: Download and calculate SHA256
        run: |
          curl -sL "$PKG_URL" -o senzingsdk.pkg
          SHA=$(shasum -a 256 senzingsdk.pkg | awk '{print $1}')
          echo "SHA256=$SHA" >> "$GITHUB_ENV"
          echo "Calculated SHA256: $SHA"
          rm senzingsdk.pkg

      - name: Update cask file
        run: |
          sed -i 's/version ".*"/version "${{ inputs.version }}"/' Casks/senzingsdk.rb
          sed -i 's/sha256 ".*"/sha256 "'"$SHA256"'"/' Casks/senzingsdk.rb

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="cask-update-${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Casks/senzingsdk.rb
          git commit -m "Update senzingsdk cask to ${{ inputs.version }}"
          git push origin "$BRANCH"
          gh pr create \
            --title "Update senzingsdk cask to ${{ inputs.version }}" \
            --body "$(cat <<EOF
          Automated update of senzingsdk cask.

          - **Version:** \`${{ inputs.version }}\`
          - **SHA256:** \`$SHA256\`
          - **Package URL:** \`$PKG_URL\`
          EOF
          )"
